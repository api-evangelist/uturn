description: UTURN Entertainment is a Saudi Arabian digital media and entertainment
  company founded in 2010 that has grown into the largest Arabic Multi-Channel Network
  (MCN) in the MENA region. It produces original digital content — comedy sketches,
  gaming (Saudi Gamer), women's lifestyle (Unseen), sports (MLM), and MMA (MMAnia)
  shows — distributed across YouTube, TikTok, Snapchat, and other social platforms,
  and offers content creation, sponsored content, branded content, and digital
  production services to brands. A 500 Global portfolio company, UTURN publishes
  no public API or developer surface.
